name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing root release tag to backfill submodule tags for (e.g. v0.4.0-rc.1).'
        required: true
        type: string

permissions: {}

jobs:
  release-please:
    name: Release Please
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.identity.outputs.release_created }}
      release_id: ${{ steps.identity.outputs.release_id }}
      tag_name: ${{ steps.identity.outputs.tag_name }}
      sha: ${{ steps.identity.outputs.sha }}
    steps:
      - name: Checkout token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Run Release Please
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/workflows/release-please-config.json
      - name: Write release identity
        if: ${{ !cancelled() && steps.release.outputs.release_created == 'true' && steps.release.outputs.id != '' && steps.release.outputs.tag_name != '' && steps.release.outputs.sha != '' }}
        id: write-identity
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_ID}" =~ ^[0-9]+$ ]]; then
            echo "Invalid release ID: ${RELEASE_ID}" >&2
            exit 1
          fi
          if [[ ! "${TAG_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ || "${TAG_NAME}" == *".."* ]]; then
            echo "Invalid root tag name: ${TAG_NAME}" >&2
            exit 1
          fi
          if [[ ! "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid release commit SHA: ${RELEASE_SHA}" >&2
            exit 1
          fi
          jq -n --arg release_id "${RELEASE_ID}" --arg tag_name "${TAG_NAME}" --arg sha "${RELEASE_SHA}" \
            '{release_id: $release_id, tag_name: $tag_name, sha: $sha}' > "${RUNNER_TEMP}/release-identity.json"
      - name: Save release identity
        if: ${{ !cancelled() && steps.write-identity.outcome == 'success' && steps.release.outputs.release_created == 'true' && steps.release.outputs.id != '' && steps.release.outputs.tag_name != '' && steps.release.outputs.sha != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/release-identity.json
          key: release-identity-${{ github.run_id }}
      - name: Restore release identity
        if: ${{ steps.release.outputs.release_created != 'true' && github.run_attempt != '1' }}
        id: restore-identity
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/release-identity.json
          key: release-identity-${{ github.run_id }}
      - name: Export release identity
        if: ${{ steps.release.outputs.release_created == 'true' || steps.restore-identity.outputs.cache-hit == 'true' }}
        id: identity
        env:
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "${RELEASE_CREATED}" != "true" ]; then
            RELEASE_ID=$(jq -r '.release_id // empty' "${RUNNER_TEMP}/release-identity.json")
            TAG_NAME=$(jq -r '.tag_name // empty' "${RUNNER_TEMP}/release-identity.json")
            RELEASE_SHA=$(jq -r '.sha // empty' "${RUNNER_TEMP}/release-identity.json")
          fi
          : "${RELEASE_ID:?RELEASE_ID is required}"
          : "${TAG_NAME:?TAG_NAME is required}"
          : "${RELEASE_SHA:?RELEASE_SHA is required}"
          if [[ ! "${RELEASE_ID}" =~ ^[0-9]+$ ]]; then
            echo "Invalid release ID: ${RELEASE_ID}" >&2
            exit 1
          fi
          if [[ ! "${TAG_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ || "${TAG_NAME}" == *".."* ]]; then
            echo "Invalid root tag name: ${TAG_NAME}" >&2
            exit 1
          fi
          if [[ ! "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid release commit SHA: ${RELEASE_SHA}" >&2
            exit 1
          fi
          {
            echo "release_created=true"
            echo "release_id=${RELEASE_ID}"
            echo "tag_name=${TAG_NAME}"
            echo "sha=${RELEASE_SHA}"
          } >> "${GITHUB_OUTPUT}"

  tag-submodules:
    name: Tag Go submodules & publish release
    needs: release-please
    if: >-
      ${{
        !cancelled() && (
          github.event_name == 'workflow_dispatch' ||
          (needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true')
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Tag Go submodules
        id: tag-modules
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          set -euo pipefail

          if [ -z "${TAG_NAME}" ]; then
            TAG_NAME="${INPUT_TAG_NAME}"
          fi
          : "${TAG_NAME:?TAG_NAME is required}"

          if [[ ! "${TAG_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ || "${TAG_NAME}" == *".."* ]]; then
            echo "Invalid root tag name: ${TAG_NAME}" >&2
            exit 1
          fi

          if [ -z "${RELEASE_SHA}" ]; then
            ref_json=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}")
            obj_type=$(jq -r '.object.type' <<< "${ref_json}")
            obj_sha=$(jq -r '.object.sha' <<< "${ref_json}")
            while [ "${obj_type}" = "tag" ]; do
              tag_json=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${obj_sha}")
              obj_type=$(jq -r '.object.type' <<< "${tag_json}")
              obj_sha=$(jq -r '.object.sha' <<< "${tag_json}")
            done
            if [ "${obj_type}" != "commit" ]; then
              echo "Root tag ${TAG_NAME} does not resolve to a commit (type: ${obj_type})" >&2
              exit 1
            fi
            RELEASE_SHA="${obj_sha}"
          fi

          submodules=$(gh api "repos/${GITHUB_REPOSITORY}/git/trees/${RELEASE_SHA}?recursive=1" \
            --jq '.tree[] | select(.type == "blob" and (.path | endswith("/go.mod")) and (.path | startswith("vendor/") | not)) | .path | rtrimstr("/go.mod")')

          while IFS= read -r mod; do
            [ -z "$mod" ] && continue
            tag="${mod}/${TAG_NAME}"
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
              echo "Tag ${tag} already exists, skipping"
              continue
            fi
            echo "Creating tag ${tag} at ${RELEASE_SHA}"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${tag}" \
              -f "sha=${RELEASE_SHA}" >/dev/null
          done <<< "${submodules}"

          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG_NAME: ${{ steps.tag-modules.outputs.tag_name }}
          RELEASE_ID: ${{ needs.release-please.outputs.release_id }}
        run: |
          set -euo pipefail
          : "${TAG_NAME:?TAG_NAME is required}"

          if [ -z "${RELEASE_ID}" ]; then
            RELEASE_ID=$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases" \
              | jq -r --arg tag "${TAG_NAME}" '[.[][] | select(.tag_name == $tag) | .id][0] // empty')
            if [ -z "${RELEASE_ID}" ]; then
              echo "No GitHub release found for ${TAG_NAME}, skipping publish"
              exit 0
            fi
          fi

          release_json=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")
          is_draft=$(jq -r '.draft' <<< "${release_json}")
          is_prerelease=$(jq -r '.prerelease' <<< "${release_json}")

          # Pre-1.0.0 override: Release Please marks all 0.x.y releases as prerelease when
          # prerelease: true is set. Publish stable 0.x.y tags (^v0\.[0-9]+\.[0-9]+$) as full
          # releases; this rule automatically deactivates for 1.0.0+ and RC tags.
          if [[ "${TAG_NAME}" =~ ^v0\.[0-9]+\.[0-9]+$ ]]; then
            if [ "${is_draft}" = "true" ] || [ "${is_prerelease}" = "true" ]; then
              echo "Publishing stable pre-1.0.0 release ${TAG_NAME} (id=${RELEASE_ID}) as full release"
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
                -F draft=false \
                -F prerelease=false \
                -f make_latest=legacy >/dev/null
            else
              echo "Release ${TAG_NAME} (id=${RELEASE_ID}) is already published as a full release"
            fi
          elif [ "${is_draft}" = "true" ]; then
            echo "Publishing release ${TAG_NAME} (id=${RELEASE_ID}, prerelease=${is_prerelease})"
            if [ "${is_prerelease}" = "true" ]; then
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
                -F draft=false >/dev/null
            else
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
                -F draft=false \
                -f make_latest=legacy >/dev/null
            fi
          else
            echo "Release ${TAG_NAME} (id=${RELEASE_ID}) is already published"
          fi
